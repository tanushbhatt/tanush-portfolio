# Optional Render "Blueprint". Use it only if you choose New > Blueprint in Render
# (see README, "Option B"). The normal "New > Static Site" flow does not need this file.
services:
  - type: web
    name: tanush-portfolio
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
